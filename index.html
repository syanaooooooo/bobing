<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#D62828">
  <title>🎲 博饼分账</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <!-- 南洋娘惹瓷砖底纹 -->
  <div class="tile-bg"></div>

  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-dice">🎲</span>
          <div class="brand-text">
            <h1 id="app-title">2026 博饼</h1>
            <span id="app-sub" class="brand-sub hide"></span>
          </div>
          <span class="brand-cake">🥮</span>
        </div>
        <button id="lock-btn" class="lock-btn" title="管理员">🔒</button>
      </div>
      <!-- 海浪装饰 -->
      <svg class="waves" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 20 Q 75 0 150 20 T 300 20 T 450 20 T 600 20 T 750 20 T 900 20 T 1050 20 T 1200 20 V40 H0 Z"/>
      </svg>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="overview">
        <span class="nav-icon">🧧</span><span class="nav-label">账目总览</span>
      </button>
      <button class="nav-btn" data-tab="bobing">
        <span class="nav-icon">🎲</span><span class="nav-label">博饼采购</span>
      </button>
      <button class="nav-btn" data-tab="expenses">
        <span class="nav-icon">🧾</span><span class="nav-label">其它账目</span>
      </button>
      <button class="nav-btn" data-tab="people">
        <span class="nav-icon">🐚</span><span class="nav-label">成员管理</span>
      </button>
    </nav>
  </div>

  <!-- 模态层 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="sync.js?v=2"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
